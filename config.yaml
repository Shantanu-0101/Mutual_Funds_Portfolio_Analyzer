# All tunable values for a run (spec §5.1). Read once by src/config.py.
# Relative paths are resolved against this file's folder; absolute paths are used as given.

paths:
  raw: data/raw
  processed: data/processed
  # chroma and cache stay inside the project unless OneDrive file-locking errors appear.
  # If they do, point these two at a folder outside OneDrive, e.g. C:/mfpa_data/chroma.
  chroma: data/chroma
  cache: data/cache          # embedding + LLM response cache
  results: results

data:
  file_glob: "*ABSL*.xls"    # only portfolio disclosures; AMFI files live in data/other/amfi
  eval_months: ["2026-09-30"]  # which month(s) the main experiment indexes (D3)

embedding:
  model: BAAI/bge-small-en-v1.5
  max_tokens: 512
  batch_size: 32

retrieval:
  top_k: 5

llm:
  provider: groq             # overridden by env LLM_PROVIDER (groq | gemini | mock)
  # Model per provider (D8, decided 13 Nov 2026). Groq's live list had no Llama chat model left;
  # gpt-oss-120b is the strongest of the three chat models there (gpt-oss-20b, qwen3.8-27b).
  # Free tier on this account: 8,000 tokens/minute, 1,000 requests/day for all three.
  models:
    groq: openai/gpt-oss-120b
    gemini: null             # set (from the live model list) before switching to gemini
    mock: mock
  reasoning_effort: low      # gpt-oss thinks before answering; hidden reasoning counts as output tokens
  temperature: 0
  max_output_tokens: 800
  timeout_s: 60
  retries: 3

chunking:
  fixed_size:    {chunk_tokens: 256, overlap_tokens: 32}
  header_window: {rows_per_chunk: 10}
  scheme_level:  {on_overflow: truncate_and_warn}
  section_aware: {max_tokens: 512}
  hierarchical:  {child: row, parent: section}

baseline:
  timeout_s: 10

eval:
  rel_tolerance: 0.01
  abs_tolerance_pct_points: 0.01
  manual_check_n: 10
  seed: 42
