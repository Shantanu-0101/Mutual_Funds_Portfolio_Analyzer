# All tunable values for a run (spec §5.1). Read once by src/config.py.
# Relative paths are resolved against this file's folder; absolute paths are used as given.

paths:
  raw: data/raw
  processed: data/processed
  # chroma and cache stay inside the project unless OneDrive file-locking errors appear.
  # If they do, point these two at a folder outside OneDrive, e.g. C:/mfpa_data/chroma.
  chroma: data/chroma
  cache: data/cache          # embedding + LLM response cache
  results: results

data:
  file_glob: "*ABSL*.xls"    # only portfolio disclosures; AMFI files live in data/other/amfi
  eval_months: ["2026-09-30"]  # which month(s) the main experiment indexes (D3)

embedding:
  model: BAAI/bge-small-en-v1.5
  max_tokens: 512
  batch_size: 32

retrieval:
  top_k: 5

llm:
  # Plan (13 Nov 2026): xAI (paid) answers, Groq (free tier) is the fallback when xAI is rate-limited,
  # out of credit or down (D8b). Switched to xai on 14 Nov 2026 for the Phase 5 run.
  # The eval runner re-runs any row the fallback answered (a different model), so the recorded
  # results come from the xai model only.
  # 14 Nov 2026: the xAI key was rejected and no paid key is available for now, so Groq (free) answers
  # and Gemini (free) is the fallback. Gemini stays inactive until GEMINI_API_KEY is in .env and
  # models.gemini is set. To go back to the paid run: provider: xai, fallback: groq.
  # 20 Nov 2026 (D8c): paid Grok now comes through Velona (a reseller, VELONA_API_KEY) instead of the
  # rejected xAI key. Velona answers, Groq is the fallback; fallback rows are re-run by the eval as before.
  provider: velona           # overridden by env LLM_PROVIDER (velona | xai | groq | gemini | mock)
  fallback: groq             # overridden by env LLM_FALLBACK; null or "none" = no fallback
  # Model per provider (D8, decided 13 Nov 2026). Groq's live list had no Llama chat model left;
  # gpt-oss-120b is the strongest of the three chat models there (gpt-oss-20b, qwen3.8-27b).
  # Free tier on this account: 8,000 tokens/minute, 1,000 requests/day for all three.
  models:
    velona: x-ai/grok-4.20              # Velona's live list 20 Nov 2026 (D8c): closest to the xai pick below; Velona has no "-non-reasoning" name, but it returned 0 reasoning tokens
    xai: grok-4.20-0309-non-reasoning   # from the live list 14 Nov 2026 (D8b); non-reasoning, your pick
    groq: openai/gpt-oss-120b
    gemini: null             # set (from the live model list) before switching to gemini
    mock: mock
  reasoning_effort: low      # groq gpt-oss only (xAI's reasoning models reject it); gpt-oss thinks before answering; hidden reasoning counts as output tokens
  temperature: 0
  max_output_tokens: 2000    # was 800; raised 14 Nov 2026: 15 replies of the first run were cut at 800 (long source lists)
  timeout_s: 60
  retries: 3

chunking:
  fixed_size:    {chunk_tokens: 256, overlap_tokens: 32}
  header_window: {rows_per_chunk: 10}
  scheme_level:  {on_overflow: truncate_and_warn}
  section_aware: {max_tokens: 512}
  hierarchical:  {child: row, parent: section}

baseline:
  timeout_s: 10

eval:
  rel_tolerance: 0.01
  abs_tolerance_pct_points: 0.01
  manual_check_n: 10
  seed: 42

# Retrieval-method benchmark (docs/SPEC_RETRIEVAL.md §5, §7). Validated by src/retrieval/settings.py.
# Defaults below are the spec's starting values; Phase R3 picks the final ones on the dev set and writes
# them here with the date (FR-R2.3).
retrieval_benchmark:
  candidate_k: 20              # every method ranks its top 20 children (FR-R2.2); the pipeline uses the first top_k
  methods:
    dense: {}                                  # M1: today's search (bge-small, cosine, Chroma)
    bm25: {k1: 1.5, b: 0.75}                   # M2: own Okapi BM25 (RD3)
    hybrid_rrf: {depth: 50, rrf_k: 60}         # M3: dense top-depth + bm25 top-depth, Reciprocal Rank Fusion
    dense_rerank: {depth: 50}                  # M4: dense top-depth, re-scored by the cross-encoder
    hybrid_rerank: {depth: 50, hybrid_depth: 50}   # M5: hybrid_rrf top-depth, re-scored
    scheme_filter: {fuzzy_threshold: 0.85, ranker: dense}   # M6: scheme names from the question, dense inside them
    mmr: {depth: 50, lambda: 0.5}              # M7: dense top-depth, then Maximal Marginal Relevance
    best_combo: null                           # M8: declared in R3 from dev results only, e.g. {filter: true, ranker: hybrid_rerank}
  grids:                       # values tried on dev in R3 (spec §5, last column)
    hybrid_rrf: {depth: [20, 50, 100]}
    dense_rerank: {depth: [20, 50]}
    hybrid_rerank: {depth: [20, 50]}
    scheme_filter: {fuzzy_threshold: [0.8, 0.85, 0.9]}
    mmr: {lambda: [0.3, 0.5, 0.7]}
    bm25: {k1: [1.2, 1.5, 2.0], b: [0.5, 0.75, 0.9]}
  reranker:                    # RD4
    model: BAAI/bge-reranker-base
    revision: 2cfc18c9415c912f9d8155881c133215df768a70   # snapshot downloaded 23 Nov 2026 (R2), safetensors only
    max_length: 512
    batch_size: 16
