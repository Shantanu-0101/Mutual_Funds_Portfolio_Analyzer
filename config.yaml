# All tunable values for a run (spec §5.1). Read once by src/config.py.
# Relative paths are resolved against this file's folder; absolute paths are used as given.

paths:
  raw: data/raw
  processed: data/processed
  # chroma and cache stay inside the project unless OneDrive file-locking errors appear.
  # If they do, point these two at a folder outside OneDrive, e.g. C:/mfpa_data/chroma.
  chroma: data/chroma
  cache: data/cache          # embedding + LLM response cache
  results: results

data:
  file_glob: "*ABSL*.xls"    # only portfolio disclosures; AMFI files live in data/other/amfi
  eval_months: ["2026-09-30"]  # which month(s) the main experiment indexes (D3)

embedding:
  model: BAAI/bge-small-en-v1.5
  max_tokens: 512
  batch_size: 32

retrieval:
  top_k: 5

llm:
  # Plan (13 Nov 2026): xAI (paid) answers, Groq (free tier) is the fallback when xAI is rate-limited,
  # out of credit or down (D8b). Switched to xai on 14 Nov 2026 for the Phase 5 run.
  # The eval runner re-runs any row the fallback answered (a different model), so the recorded
  # results come from the xai model only.
  # 14 Nov 2026: the xAI key was rejected and no paid key is available for now, so Groq (free) answers
  # and Gemini (free) is the fallback. Gemini stays inactive until GEMINI_API_KEY is in .env and
  # models.gemini is set. To go back to the paid run: provider: xai, fallback: groq.
  provider: groq             # overridden by env LLM_PROVIDER (xai | groq | gemini | mock)
  fallback: gemini           # overridden by env LLM_FALLBACK; null or "none" = no fallback
  # Model per provider (D8, decided 13 Nov 2026). Groq's live list had no Llama chat model left;
  # gpt-oss-120b is the strongest of the three chat models there (gpt-oss-20b, qwen3.8-27b).
  # Free tier on this account: 8,000 tokens/minute, 1,000 requests/day for all three.
  models:
    xai: grok-4.20-0309-non-reasoning   # from the live list 14 Nov 2026 (D8b); non-reasoning, your pick
    groq: openai/gpt-oss-120b
    gemini: null             # set (from the live model list) before switching to gemini
    mock: mock
  reasoning_effort: low      # groq gpt-oss only (xAI's reasoning models reject it); gpt-oss thinks before answering; hidden reasoning counts as output tokens
  temperature: 0
  max_output_tokens: 2000    # was 800; raised 14 Nov 2026: 15 replies of the first run were cut at 800 (long source lists)
  timeout_s: 60
  retries: 3

chunking:
  fixed_size:    {chunk_tokens: 256, overlap_tokens: 32}
  header_window: {rows_per_chunk: 10}
  scheme_level:  {on_overflow: truncate_and_warn}
  section_aware: {max_tokens: 512}
  hierarchical:  {child: row, parent: section}

baseline:
  timeout_s: 10

eval:
  rel_tolerance: 0.01
  abs_tolerance_pct_points: 0.01
  manual_check_n: 10
  seed: 42
